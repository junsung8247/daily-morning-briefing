name: Daily Morning & Evening Briefing Auto-Update

on:
  schedule:
    # 한국시간(KST) 매일 08:00 (UTC 23:00) 및 20:00 (UTC 11:00) 정각 실행
    - cron: '0 23,11 * * *'
  workflow_dispatch: # GitHub 웹에서 언제든 수동 실행 가능

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Latest Briefing & Tiered Archives (7d / 30d / 120d)
        run: |
          python scripts/generate_briefing.py

      - name: Commit and Push updated briefing data & charts
        run: |
          git config user.name "junsung8247"
          git config user.email "junsung8247@gmail.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: auto-update briefing ($(date '+%Y-%m-%d %H:%M KST'))"
          git push origin main
