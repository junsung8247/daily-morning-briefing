<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
    <rect width="900" height="480" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="32" y="44" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="22" font-weight="900">비트코인 대 금 교환비율(BTC-to-Gold Ratio, 온스) 추이 및 상대적 밸류에이션 비교</text>
    <text x="32" y="72" fill="#475569" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600">오늘 저녁 글로벌 BTC($73,700) 및 금 현물($4,040) 기준 1 BTC = 금 18.2온스로 압축… 과거 고점(36온스) 대비 절반 수준 저평가</text>
    
    <rect x="560" y="24" width="15" height="15" rx="3" fill="#7c3aed"/>
