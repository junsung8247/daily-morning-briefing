    <text x="32" y="44" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="22" font-weight="900">글로벌 SMR 프로젝트별 진행 현황 및 한국 원전 주기기 제조(두산에너빌리티) 수혜 지수 비교</text>
    <text x="32" y="72" fill="#475569" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600">캐나다 달링턴(BWRX-300)은 일정·비용 재산정 겪는 반면, 미 뉴스케일파워(모듈 실물제조) 및 엑스에너지(NRC 건설허가)는 속도전</text>
    
