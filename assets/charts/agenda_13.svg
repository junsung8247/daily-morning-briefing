    <text x="32" y="72" fill="#475569" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600">2022년 외환보유고 동결 사태 이전(월 17톤) 대비 3.5배인 월평균 60톤 매입세가 2026~2027년 내내 이어질 전망</text>
    
