            <text x="710" y="398" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">중국 저물가(CPI 0.7%)·규제 직격탄을 맞는 대중 의존 레거시 종목은 비중 축소 필수</text>
