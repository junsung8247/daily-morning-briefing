            <text x="190" y="208" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">중국 AI 팹리스의 첨단 파운드리 우회 접근 차단 — 중국은 SMIC 구공정 자립 가속</text>
