    <text x="32" y="44" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="22" font-weight="900">미·중 기술·광물 디커플링 신국면과 한국 산업별 유불리 매트릭스</text>
    <text x="32" y="72" fill="#475569" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600">대중 레거시 의존 기업은 타격 vs 북미·유럽 직납 비중이 압도적인 5대 탈중국 병목 제조업은 수혜</text>
