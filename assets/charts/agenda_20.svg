            <text x="710" y="208" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">중국의 희토류 정련 독점에 맞서 미주·동맹국 광물 공급망 자립 프로젝트 가속</text>
