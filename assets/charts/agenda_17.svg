    <text x="32" y="44" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="22" font-weight="900">미 비트코인 현물 ETF 주요 펀드별 주간 유출입 대조 (백만 달러, $M)</text>
    <text x="32" y="72" fill="#475569" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600">블랙록 IBIT(-$1,210M)와 그레이스케일(-$61M) 유출 속에서도 피델리티 FBTC는 +$93.1M 순유입을 기록하며 저가 매수</text>
    
