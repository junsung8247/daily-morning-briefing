    <text x="32" y="44" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="22" font-weight="900">1기 신도시 선도지구 권역별 사업 추진 속도('2027 착공' 가시성) 및 사업성 지수 비교</text>
    <text x="32" y="72" fill="#475569" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600">분당은 대다수 구역이 사업시행자 지정을 완료하고 시공사 선정 단계로 직행하며 '2027년 첫 착공' 목표에서 압도적 선두</text>
    
