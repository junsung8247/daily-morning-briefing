<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
    <rect width="900" height="480" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="32" y="44" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="22" font-weight="900">11월 미국 비트코인 현물 ETF 자금 이탈 규모($B) 및 자산별 11/23 반등 격차</text>
    <text x="32" y="72" fill="#475569" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600">30일간 -$3.5B~$4.5B(주간 -$1.79B)에 달하는 기관 ETF 환매가 비트코인 7,974만원의 즉각 반등을 억제</text>
    
