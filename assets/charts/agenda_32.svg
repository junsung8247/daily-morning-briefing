<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
    <rect width="900" height="480" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="32" y="44" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="22" font-weight="900">미국 주요 비트코인 현물 ETF 보유 순자산(Net Assets) 및 누적 유입 규모 비교 ($B)</text>
    <text x="32" y="72" fill="#475569" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600">단기 7일 유출(-$1.66B)에도 블랙록 IBIT($59.29B)와 피델리티 FBTC($13.07B), 전체 ETF 총자산($95B)은 압도적 규모 유지</text>
    
