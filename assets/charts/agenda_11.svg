    <text x="32" y="72" fill="#475569" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600">일반 서버(10kW) ➔ 호퍼(40kW) ➔ 블랙웰(120kW) ➔ 베라 루빈 NVL72(200~230kW)로 랙당 전력·열밀도 기하급수 폭증</text>
    
