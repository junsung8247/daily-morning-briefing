    <text x="32" y="44" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="22" font-weight="900">11/28 미국 블랙프라이데이·사이버위크 사상 최대 온라인 소비 규모 ($B, Adobe)</text>
    <text x="32" y="72" fill="#475569" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600">추수감사절 $7.1B(+10.4%)·블프 $12.9B(+9.2%)·사이버먼데이 $15.1B·5일간 사이버위크 $47.5B(+7.4%) 역대급 기록 행진!</text>
    
