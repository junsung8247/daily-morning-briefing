    <text x="32" y="44" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="22" font-weight="900">한화에어로스페이스(Hanwha)의 글로벌 4대 영토 확장: 폴란드 유도탄 착공 · 중동 EDGE · 미 탄약 · 해양 수소전지</text>
