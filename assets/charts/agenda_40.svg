    <text x="32" y="44" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="22" font-weight="900">2026~2027 한국 부동산 중장기 핵심 개발 축과 리스크 필터 4원칙</text>
    <text x="32" y="72" fill="#475569" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600">재초환·이주비 대출 제한이라는 규제 필터를 통과할 수 있는 압도적 사업성·입지 핵심지만 장기 보유 가치 확보</text>
