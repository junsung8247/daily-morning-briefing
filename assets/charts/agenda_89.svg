            <text x="190" y="374" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle">단백질·분자 모델링 가속</text>
            <text x="190" y="398" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">보스턴 바이오 콘퍼런스서 양자 알고리즘 + 생성형 AI 단백질 설계 결합이 제약사 신약 후보물질 최적화 주도</text>
