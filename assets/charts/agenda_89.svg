            <text x="710" y="184" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle">적색광 ➔ 자외선 고효율 변환</text>
            <text x="710" y="208" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">거대 광학 테이블을 손톱만 한 칩으로 축소 — 양자컴퓨터·차세대 원자시계(양자항법) 소형화 핵심 돌파구</text>
        </g>
        
        <g>
