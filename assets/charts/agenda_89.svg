            <text x="190" y="184" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle">통계적 정확도 최초 검증</text>
            <text x="190" y="208" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">최정상 슈퍼컴이 풀기 힘든 초고난도 문제를 초전도 양자컴이 15분 만에 해결 + 신규 오류검출법으로 신뢰도 검증!</text>
        </g>
        
        <g>
            <rect x="560" y="125" width="300" height="100" rx="12" fill="#f8fafc" stroke="#0284c7" stroke-width="2.4"/>
