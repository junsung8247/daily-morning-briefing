            <text x="710" y="374" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle">우주·지상 독립 칩/전력</text>
            <text x="710" y="398" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">머스크 독자 팹 구상 논의와 맞물려 하이퍼스케일러의 SMR·차세대 원전 장기 전력 계약 경쟁 가속</text>
