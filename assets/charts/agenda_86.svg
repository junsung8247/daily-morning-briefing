            <text x="710" y="184" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle">$240억 슈퍼컴·테라팹</text>
            <text x="710" y="208" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">텍사스 브라운즈빌 AI·바이오 슈퍼컴 + 그라임스카운티 $1,000억 테라팹 + 스타마인드 100만 위성 직결</text>
        </g>
        
        <g>
