            <text x="710" y="374" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle">초거대 연산 ➔ 바이오 가속</text>
            <text x="710" y="398" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">스페이스X 브라운즈빌 슈퍼컴·PsiQuantum-AMD 양자 인프라가 신약 분자 구조 시뮬레이션 시간 획기적 단축</text>
