    <text x="32" y="44" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="22" font-weight="900">11/22(일) 긴급 F4 시장상황점검회의 4대 증시 안정 패키지 ('검은 월요일' 총력 방어)</text>
    <text x="32" y="72" fill="#475569" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600">금요일 SOX -10.73%·코스피200 야간선물 -6.99% 충격에 정부·한은·금융당국이 18년 만의 증안펀드 가동 준비까지 전격 착수</text>
