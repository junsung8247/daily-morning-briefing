            <text x="710" y="184" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle">SK · 삼성 공통 채택</text>
            <text x="710" y="208" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">엔비디아 요청으로 베이스 다이 로직을 TSMC 3nm로 표준화</text>
        </g>
        
        <g>
