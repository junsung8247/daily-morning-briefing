            <text x="190" y="374" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle">잔금대출 미확보 매물</text>
            <text x="190" y="398" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">주산연 조사 미입주 1순위 원인이 '잔금대출 미확보' — 현금 보유자의 급매·급전세 찬스</text>
