            <text x="710" y="374" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle">DSR 3단계 예외 체크</text>
            <text x="710" y="398" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">과거 입주자모집공고 단지는 스트레스 DSR 경과규정 적용 가능 여부 은행 사전 확인 필수</text>
