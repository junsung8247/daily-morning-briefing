            <text x="710" y="184" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle">연 3%+ CMA·단기채 대기</text>
            <text x="710" y="208" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">30억 로또 청약 대기자들은 12월 초 재심의 결과 공고 전까지 예치금 유동성 유지 필수</text>
        </g>
        
        <g>
