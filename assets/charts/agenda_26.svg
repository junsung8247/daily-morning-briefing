    <text x="32" y="44" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="22" font-weight="900">원/달러 환율 1,331.66원 & 미 금리 5.00% 구간에서 환헤지(H) vs 환노출(UH) 미국채 실질 기대수익 비교</text>
    <text x="32" y="72" fill="#475569" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600">환헤지(H) 시 연 ~1.85%p 비용 차감… 미 금리 5.00%에 환율이 1,331.66원까지 내려온 오늘 저녁은 환노출(UH) 매수의 최적점</text>
    
