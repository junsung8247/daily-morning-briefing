<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
    <rect width="900" height="480" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="32" y="44" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="22" font-weight="900">원/달러 환율 1,336.6원 & 미 금리 5.00% 구간에서 환헤지(H) vs 환노출(UH) 미국채 실질 기대수익 비교</text>
    <text x="32" y="72" fill="#475569" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600">한·미 금리 역전으로 환헤지(H) 시 연 ~1.85%p 비용 차감… 미 금리 5.00% + 환율 1,336.6원 조합에서는 환노출(UH)이 압도적 유리</text>
    
