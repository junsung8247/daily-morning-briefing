            <text x="190" y="374" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle">페트로 라비그 정유소 표적</text>
            <text x="190" y="398" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">이란 '미 해군 봉쇄 총력 대응' 경고 + 후티 사우디 정유소 공격(단 WTI는 $79.99 안정)</text>
