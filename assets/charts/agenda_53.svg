            <text x="710" y="398" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">UN COP31 기후회의 화석연료 퇴출 공식 합의 무산 ➔ 전통 에너지 공급 여유 지속</text>
