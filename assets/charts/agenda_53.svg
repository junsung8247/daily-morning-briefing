            <text x="710" y="184" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle">리비아 벵가지 러 군함 격침</text>
            <text x="710" y="208" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">젤렌스키: 전선서 2,400km 떨어진 리비아 벵가지항서 러 신형 초계함(메르쿠리)·Ka-27 격파</text>
        </g>
        
        <g>
