            <text x="710" y="398" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">소수 반도체·방산·조선 종목에 몰빵한 테마 ETF들이 하반기 조정장서 상장가 밑으로 추락하며 타격</text>
