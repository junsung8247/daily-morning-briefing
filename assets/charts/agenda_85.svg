            <text x="190" y="398" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">수출이 HBM·메모리에 과도 편중돼 미 관세·AI 투자 논란 시 코스피가 하루 ±6% 출렁이는 변동성 노출</text>
