            <text x="710" y="184" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle">삼성 30조 · SK 환원 공시</text>
            <text x="710" y="208" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">삼성전자 30조 현금배당·SK하이닉스 대규모 주주환원 계획 공시로 코리아 디스카운트 해소 가속</text>
