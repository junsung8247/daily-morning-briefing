            <text x="190" y="184" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle">반도체·조선·방산·원전</text>
            <text x="190" y="208" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">한국 경제 역사상 최초로 연간 누적 수출 1조 달러 돌파 ➔ 한은 2027년 4.1% 성장 전망의 실물 토대</text>
        </g>
        
        <g>
