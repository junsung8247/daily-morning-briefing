    <text x="32" y="44" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="22" font-weight="900">11/28 블랙프라이데이 실시간 결제 집계 비교 (어도비 미국 vs 세일즈포스 미국·글로벌, $B)</text>
    <text x="32" y="72" fill="#475569" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600">어도비 미국 온라인 최종 예상치가 $12.9B에서 $13.0~13.4B로 상향! 세일즈포스 글로벌 온라인은 $83B(+5.2%) 기록!</text>
    
