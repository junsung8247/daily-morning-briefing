            <text x="710" y="374" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle">목 휴장 · 금 조기 폐장</text>
            <text x="710" y="398" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">얇은 거래량 속 델(Dell)·HP 실적 및 단기 변동성 확대 주의</text>
