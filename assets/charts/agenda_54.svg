            <text x="710" y="208" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">추수감사절 휴장 전 미 10월 PCE·GDP·내구재·실업수당·베이지북 동시 발표</text>
