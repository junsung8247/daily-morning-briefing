<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
    <rect width="900" height="480" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="32" y="44" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="22" font-weight="900">차주(11/23~11/27) 추수감사절 휴장 주간 일자별 초대형 매크로 이벤트 타임테이블</text>
    <text x="32" y="72" fill="#475569" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600">월(글로벌 PMI) ➔ 수(미 10월 PCE·Q3 GDP·내구재·실업·베이지북 5연타!) ➔ 목(한은 금통위 3.00% vs 3.25% · 미 휴장)</text>
