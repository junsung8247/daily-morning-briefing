            <text x="190" y="184" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle">최대 100만 위성 · 500~1002km</text>
            <text x="190" y="208" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">미 FCC 우주국, 우주 궤도 AI 데이터센터 군집 '스타마인드(Starmind)' 조건부 허가 — 태양광·냉각 혁신</text>
