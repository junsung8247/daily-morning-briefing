            <text x="710" y="184" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle">기업가치 $3.5조+ 거론</text>
            <text x="710" y="208" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">사외이사 독립위원회 차원의 구조적 결합·합병 가능성 보도(로켓·스타링크·로봇·AI 통합 제국)</text>
