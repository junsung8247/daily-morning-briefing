            <text x="710" y="398" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">네오클라우드·AI 전력주 조정 속 SMR 테마주 변동성 확대 — HALEU 연료·실제 주기기가 승부</text>
