            <text x="190" y="398" fill="#475569" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">옵티머스 3세대 양산 및 그록 AI 결합 임상·헬스케어 진출 + 스타십 화성 수송 통합 로드맵</text>
