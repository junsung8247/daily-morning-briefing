<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
    <rect width="900" height="480" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="32" y="44" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="22" font-weight="900">주담대 5억 원(30년 만기 원리금균등) 금리 수준별 월 상환액 변화 (만 원)</text>
    <text x="32" y="72" fill="#475569" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600">금리가 4.5%에서 6.0%·6.5%로 오를수록 월 상환액이 46~63만 원(연 550~756만 원) 급증하며 매수 심리 압박</text>
    
