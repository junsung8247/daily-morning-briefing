    <text x="32" y="72" fill="#475569" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600">실제 대출 가능액 수천만 원 축소로 무리한 추격 매수는 줄고 '핵심지 현금매수·역세권 59㎡·전세 잔류'로 수요 재편</text>
    
