    <text x="32" y="72" fill="#475569" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600">주택산업연구원 11월 수도권 입주전망지수 급락… 잔금대출 한도 축소가 미입주 원인 1위로 부상하며 전세 및 59㎡ 쏠림 가속</text>
    
