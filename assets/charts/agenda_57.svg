<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
    <rect width="900" height="480" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="32" y="44" fill="#0f172a" font-family="Pretendard, sans-serif" font-size="22" font-weight="900">11월 전국 4~5만 가구 분양 큰 장 속 서울 일반분양 비중(단 7%) & 주요 재초환 예상액(억 원)</text>
    <text x="32" y="72" fill="#475569" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600">서울 52개 재건축 평균 부담금 1.1억(한강맨션 7억+) 압박 vs 11월 서울 일반분양 2,457가구(전국의 7%) 극단적 희소성</text>
    
